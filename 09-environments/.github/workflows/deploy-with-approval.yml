name: Deploy with Environment Approval

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Build OK — pronto para promover"

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Verifica secret do environment
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN não disponível"; exit 1
          fi
          echo "Token len=${#TOKEN} (mascarado nos logs)"
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - run: echo "Deploy aprovado e executado em production"
