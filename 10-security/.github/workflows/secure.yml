name: Secure Workflow (hardening completo)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege global — sobrescreve qualquer permissão default
permissions:
  contents: read

jobs:
  hardened:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Permissions específicas só onde necessário (override do nível workflow)
    permissions:
      contents: read
      id-token: write   # para OIDC, exemplo

    steps:
      # Pinning por SHA (exemplo: actions/checkout v4.1.7)
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: '20'

      - name: Mascarar valor derivado
        run: |
          DERIVED="abc-$(date +%s)"
          echo "::add-mask::$DERIVED"
          echo "Vou imprimir: $DERIVED (vai sair como ***)"

      - name: Demonstrar que GITHUB_TOKEN é read-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lista issues (read) — funciona
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&per_page=1" \
            | head -c 200; echo
